# TETHER Mission Control - local containerised deployment.
#
#   nginx (reverse proxy)  ->  web (Django)  ->  db (PostgreSQL + PostGIS)
#                                                              ^
#                                                   pgadmin ---+
#
# All services sit on one isolated bridge network with a custom subnet.
# Only nginx (and pgAdmin, for the demo) publish ports to the host.

name: tether

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tether_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data          # data survives restarts (Data Persistence)
    networks:
      tether_net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No "ports:" entry on purpose - the database is only reachable inside the
    # tether_net network (pgAdmin and Django connect to it by service name).

  web:
    build:
      context: ./project
    container_name: tether_web
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      tether_net:
        ipv4_address: 172.28.0.20
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: tether_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    networks:
      tether_net:
        ipv4_address: 172.28.0.30

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: tether_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"     # bound to localhost only
    networks:
      tether_net:
        ipv4_address: 172.28.0.40

networks:
  tether_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  pgadmin_data:
